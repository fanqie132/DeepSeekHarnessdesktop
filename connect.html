<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手机连接 - DeepSeek Harness</title>
    <script type="module" src="/src/connect.ts" defer></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        color: #1f2937;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }
      /* 自绘标题栏：可拖拽 + 关闭按钮 */
      .titlebar {
        display: flex; justify-content: space-between; align-items: center;
        height: 36px; padding-left: 14px; flex-shrink: 0;
      }
      .titlebar-title { font-size: 12px; color: #6b7280; }
      #btn-close {
        width: 46px; height: 36px; border: none; background: transparent;
        font-size: 15px; color: #6b7280; cursor: pointer; line-height: 1;
      }
      #btn-close:hover { background: #ef4444; color: #fff; }
      #content {
        flex: 1; text-align: center; overflow-y: auto;
        padding: 0 18px;
      }
      #whale {
        width: 40px; height: 40px; margin: 4px auto 6px;
        animation: swim 3s ease-in-out infinite;
      }
      #whale img { width: 100%; height: 100%; }
      @keyframes swim { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      #title { font-size: 16px; font-weight: 600; color: #1f2937; }
      #subtitle { margin-top: 5px; font-size: 12px; color: #6b7280; line-height: 17px; overflow-wrap: anywhere; }
      #qr-wrap {
        width: 196px; height: 196px; margin: 12px auto;
        padding: 10px; background: #fff;
        border: 1px solid #e5e7eb; border-radius: 12px;
        box-shadow: 0 2px 10px rgba(0,0,0,.06);
      }
      #qr-wrap svg, #qr-wrap img { width: 100%; height: 100%; display: block; }
      #addr-row {
        display: flex; align-items: center; gap: 8px;
        max-width: 320px; margin: 0 auto;
      }
      #addr {
        flex: 1; text-align: left;
        font-family: Consolas, monospace; font-size: 11px;
        color: #4b5563; background: #f9fafb;
        border: 1px solid #e5e7eb; border-radius: 8px;
        padding: 7px 9px; user-select: text;
        overflow-wrap: anywhere; max-height: 48px; overflow-y: auto;
      }
      #btn-copy {
        flex-shrink: 0; height: 32px; padding: 0 12px;
        border-radius: 16px; border: none; cursor: pointer;
        font-size: 12px; font-weight: 500;
        background: #4176e6; color: #fff;
      }
      #btn-copy:hover { background: #365fcc; }
      #btn-copy.copied { background: #10b981; }
      #hint { margin-top: 10px; font-size: 11px; color: #9ca3af; line-height: 16px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region>
      <span class="titlebar-title">手机连接 - DeepSeek Harness</span>
      <button id="btn-close" title="关闭">✕</button>
    </div>
    <div id="content">
      <div id="whale"><img src="/whale.svg" alt="whale" /></div>
      <p id="title">手机扫码连接</p>
      <p id="subtitle">同一 WiFi 下，用手机浏览器扫码即可打开 DeepSeek Harness</p>
      <div id="qr-wrap"><div id="qr"><p style="padding-top:100px;font-size:12px;color:#9ca3af;">正在生成二维码...</p></div></div>
      <div id="addr-row">
        <div id="addr">等待连接信息...</div>
        <button id="btn-copy">复制地址</button>
      </div>
      <p id="hint">
        首次打开若提示「连接不是私密连接」：点
        <b>高级</b> → <b>继续前往</b>（自签名证书的正常提示，仅需一次）；
        若打不开请确认手机与本电脑在同一 WiFi，且手机 VPN 已关闭
      </p>
    </div>
  </body>
</html>

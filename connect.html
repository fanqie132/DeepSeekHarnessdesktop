<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手机连接 - DeepSeek Harness</title>
    <script type="module" src="/src/connect.ts" defer></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        text-align: center;
        background: #ffffff;
        color: #1f2937;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        padding: 14px 16px;
      }
      #whale {
        width: 40px; height: 40px; margin: 0 auto 6px;
        animation: swim 3s ease-in-out infinite;
      }
      #whale img { width: 100%; height: 100%; }
      @keyframes swim { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      #title { font-size: 15px; font-weight: 600; }
      #subtitle { margin-top: 4px; font-size: 12px; color: #6b7280; line-height: 16px; }
      #qr-wrap {
        width: 186px; height: 186px; margin: 10px auto;
        padding: 8px;
        border: 1px solid #e5e7eb; border-radius: 12px;
      }
      #qr-wrap img, #qr-wrap canvas { width: 100%; height: 100%; display: block; }
      #addr-row {
        display: flex; align-items: center; justify-content: center;
        gap: 8px; margin-top: 10px; padding: 0 6px;
      }
      #addr {
        flex: 1; min-width: 0; max-width: 224px;
        text-align: left;
        font-family: Consolas, monospace; font-size: 11px;
        color: #4b5563; background: #f9fafb;
        border: 1px solid #e5e7eb; border-radius: 8px;
        padding: 6px 9px; user-select: text;
        overflow-wrap: anywhere;
      }
      #btn-copy {
        flex-shrink: 0; white-space: nowrap;
        height: 32px; padding: 0 13px;
        border-radius: 16px; border: none; cursor: pointer;
        font-size: 11px; font-weight: 500;
        background: #4176e6; color: #fff;
      }
      #btn-copy:hover { background: #365fcc; }
      #btn-copy.copied { background: #10b981; }
      #hint { margin-top: 9px; font-size: 11px; color: #9ca3af; line-height: 15px; }
    </style>
  </head>
  <body>
    <div id="whale"><img src="/whale.svg" alt="whale" /></div>
    <p id="title">手机扫码连接</p>
    <p id="subtitle">同一 WiFi 下，用手机浏览器扫码即可打开 DeepSeek Harness</p>
    <div id="qr-wrap"><div id="qr"><p style="padding-top:80px;font-size:12px;color:#9ca3af;">正在生成二维码...</p></div></div>
    <div id="addr-row">
      <div id="addr">等待连接信息...</div>
      <button id="btn-copy">复制地址</button>
    </div>
    <p id="hint">
      若提示「连接不是私密连接」：点 <b>高级</b> → <b>继续前往</b>（仅需一次）
    </p>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <script type="module" src="/src/main.ts" defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #ffffff;
        color: #1f2937;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #loading {
        text-align: center;
      }
      #whale {
        width: 128px;
        height: 128px;
        margin: 0 auto 24px;
        animation: swim 3s ease-in-out infinite;
      }
      #whale img {
        width: 100%;
        height: 100%;
      }
      @keyframes swim {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      #status {
        font-size: 15px;
        color: #374151;
      }
      #quote {
        margin-top: 12px;
        font-size: 13px;
        color: #6b7280;
        font-style: italic;
      }
      #progress-wrap {
        display: none;
        width: 320px;
        margin: 24px auto 0;
      }
      #progress-bar {
        width: 100%;
        height: 6px;
        background: #e5e7eb;
        border-radius: 3px;
        overflow: hidden;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background: #4176e6;
        border-radius: 3px;
        transition: width 0.2s ease;
      }
      #progress-text {
        margin-top: 8px;
        font-size: 12px;
        color: #6b7280;
      }
      #progress-hint {
        margin-top: 6px;
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <div id="whale"><img src="/whale.svg" alt="DeepSeek Harness" /></div>
      <p id="status">正在启动 DeepSeek Harness...</p>
      <p id="quote"></p>
      <div id="progress-wrap">
        <div id="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <p id="progress-text"></p>
        <p id="progress-hint"></p>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <script type="module" src="/src/main.ts" defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0f1115;
        color: #e8eaed;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #loading {
        text-align: center;
      }
      #whale {
        width: 88px;
        height: 64px;
        margin: 0 auto 24px;
        animation: swim 3s ease-in-out infinite;
      }
      .pixel {
        width: 8px;
        height: 8px;
        box-shadow:
          0 32px 0 0 #3b82f6, 8px 32px 0 0 #3b82f6, 16px 32px 0 0 #3b82f6,
          24px 24px 0 0 #3b82f6, 32px 24px 0 0 #3b82f6, 40px 24px 0 0 #3b82f6,
          48px 24px 0 0 #3b82f6, 56px 24px 0 0 #3b82f6, 64px 24px 0 0 #3b82f6,
          72px 24px 0 0 #60a5fa, 80px 24px 0 0 #60a5fa,
          24px 16px 0 0 #2563eb, 32px 16px 0 0 #2563eb, 40px 16px 0 0 #2563eb,
          48px 16px 0 0 #2563eb, 56px 16px 0 0 #2563eb, 64px 16px 0 0 #2563eb,
          72px 16px 0 0 #3b82f6, 80px 16px 0 0 #60a5fa,
          24px 8px 0 0 #1d4ed8, 32px 8px 0 0 #1d4ed8, 40px 8px 0 0 #2563eb,
          48px 8px 0 0 #2563eb, 56px 8px 0 0 #2563eb, 64px 8px 0 0 #3b82f6,
          72px 8px 0 0 #3b82f6,
          24px 0 0 0 #1d4ed8, 32px 0 0 0 #1e40af, 40px 0 0 0 #1e40af,
          48px 0 0 0 #1e40af, 56px 0 0 0 #1e40af, 64px 0 0 0 #2563eb,
          0 40px 0 0 #3b82f6, 8px 40px 0 0 #3b82f6, 16px 40px 0 0 #3b82f6,
          24px 40px 0 0 #3b82f6, 32px 40px 0 0 #2563eb, 40px 40px 0 0 #2563eb,
          48px 40px 0 0 #2563eb, 56px 40px 0 0 #3b82f6, 64px 40px 0 0 #3b82f6,
          72px 40px 0 0 #60a5fa, 80px 40px 0 0 #60a5fa,
          8px 48px 0 0 #3b82f6, 16px 48px 0 0 #3b82f6, 24px 48px 0 0 #3b82f6,
          32px 48px 0 0 #3b82f6, 40px 48px 0 0 #3b82f6, 48px 48px 0 0 #3b82f6,
          56px 48px 0 0 #3b82f6, 64px 48px 0 0 #60a5fa, 72px 48px 0 0 #60a5fa,
          80px 48px 0 0 #93c5fd, 88px 48px 0 0 #93c5fd,
          8px 56px 0 0 #3b82f6, 16px 56px 0 0 #3b82f6, 24px 56px 0 0 #3b82f6,
          32px 56px 0 0 #3b82f6, 40px 56px 0 0 #3b82f6, 48px 56px 0 0 #60a5fa,
          56px 56px 0 0 #60a5fa, 64px 56px 0 0 #93c5fd, 72px 56px 0 0 #93c5fd;
      }
      @keyframes swim {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      #quote {
        margin-top: 16px;
        font-size: 13px;
        color: #6b7280;
        font-style: italic;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 20px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4d9fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 14px;
        color: #9aa0a6;
      }
      #progress-wrap {
        display: none;
        width: 320px;
        margin: 24px auto 0;
      }
      #progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background: #4d9fff;
        border-radius: 3px;
        transition: width 0.2s ease;
      }
      #progress-text {
        margin-top: 8px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <div id="whale"><div class="pixel"></div></div>
      <p id="status">正在启动 DeepSeek Harness...</p>
      <p id="quote"></p>
      <div id="progress-wrap">
        <div id="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <p id="progress-text"></p>
      </div>
    </div>
  </body>
</html>

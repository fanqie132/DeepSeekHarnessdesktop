<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>更新 - DeepSeek Harness</title>
    <script type="module" src="/src/updater.ts" defer></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        color: #1f2937;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }
      .titlebar {
        display: flex; justify-content: space-between; align-items: center;
        height: 36px; padding-left: 14px; flex-shrink: 0;
      }
      .titlebar-title { font-size: 12px; color: #6b7280; }
      #btn-close {
        width: 46px; height: 36px; border: none; background: transparent;
        font-size: 15px; color: #6b7280; cursor: pointer; line-height: 1;
      }
      #btn-close:hover { background: #ef4444; color: #fff; }
      #updater {
        flex: 1; text-align: center; width: 360px; margin: 0 auto;
        display: flex; flex-direction: column; justify-content: center;
      }
      #whale {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        animation: swim 3s ease-in-out infinite;
      }
      #whale img { width: 100%; height: 100%; }
      @keyframes swim { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      #title { font-size: 16px; font-weight: 600; color: #1f2937; }
      #subtitle { margin-top: 8px; font-size: 12px; color: #6b7280; line-height: 18px; }
      #progress-wrap { margin-top: 20px; }
      #progress-bar {
        width: 100%;
        height: 6px;
        background: #e5e7eb;
        border-radius: 3px;
        overflow: hidden;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background: #4176e6;
        border-radius: 3px;
        transition: width 0.2s ease;
      }
      #progress-text { margin-top: 8px; font-size: 12px; color: #4176e6; }
      #progress-hint { margin-top: 4px; font-size: 11px; color: #9ca3af; }
      #actions { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
      .btn {
        min-width: 96px;
        height: 34px;
        border-radius: 17px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
      }
      .btn-primary { background: #4176e6; color: #fff; }
      .btn-primary:hover { background: #365fcc; }
      .btn-ghost { background: #f3f4f6; color: #374151; }
      .btn-ghost:hover { background: #e5e7eb; }
      .hidden { display: none !important; }
      #error { margin-top: 12px; font-size: 11px; color: #ef4444; word-break: break-all; text-align: left; background: #fef2f2; border-radius: 6px; padding: 8px; display: none; }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region>
      <span class="titlebar-title">DeepSeek Harness 更新</span>
      <button id="btn-close" title="关闭">✕</button>
    </div>
    <div id="updater">
      <div id="whale"><img src="/whale.svg" alt="whale" /></div>
      <p id="title">发现新版本</p>
      <p id="subtitle">正在准备更新...</p>
      <div id="progress-wrap">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <p id="progress-text"></p>
        <p id="progress-hint"></p>
      </div>
      <div id="actions">
        <button id="btn-update" class="btn btn-primary">立即更新</button>
        <button id="btn-later" class="btn btn-ghost">稍后</button>
      </div>
      <div id="error"></div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none; padding: 6px;
      }
      #menu {
        width: 208px; padding: 5px;
        background: rgba(255,255,255,.97);
        border: 1px solid rgba(0,0,0,.08);
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0,0,0,.18);
      }
      @media (prefers-color-scheme: dark) {
        #menu { background: rgba(31,33,38,.98); border-color: rgba(255,255,255,.1); }
        .mi { color: #e5e7eb !important; }
        .mi:hover { background: rgba(255,255,255,.09) !important; }
        .sep { background: rgba(255,255,255,.1) !important; }
        .check { color: #7aa2f7 !important; }
      }
      .mi {
        display: flex; align-items: center; gap: 8px;
        height: 34px; padding: 0 12px; margin: 1px 0;
        border-radius: 7px; cursor: pointer;
        font-size: 13px; color: #374151; line-height: 34px;
      }
      .mi:hover { background: #f3f4f6; }
      .mi.danger { color: #ef4444; }
      .mi.disabled { opacity: .45; cursor: default; }
      .check {
        width: 16px; text-align: center; font-size: 12px;
        color: #4176e6; visibility: hidden;
      }
      .on .check { visibility: visible; }
      .sep { height: 1px; margin: 5px 8px; background: rgba(0,0,0,.07); cursor: default; }
    </style>
  </head>
  <body>
    <div id="menu">
      <div class="mi" data-id="show">显示主窗口</div>
      <div class="mi" data-id="restart">重启服务</div>
      <div class="sep"></div>
      <div class="mi" id="mi-lan" data-id="lan"><span class="check">✓</span>局域网访问（手机）</div>
      <div class="mi" id="mi-qr" data-id="qr">显示连接二维码</div>
      <div class="sep"></div>
      <div class="mi danger" data-id="quit">退出</div>
    </div>
    <script type="module" src="/src/traymenu.ts"></script>
  </body>
</html>

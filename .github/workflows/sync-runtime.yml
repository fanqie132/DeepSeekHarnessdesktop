name: sync-runtime

on:
  schedule:
    - cron: "0 */6 * * *" # 姣?6 灏忔椂妫€鏌ワ紙UTC 0/6/12/18 = CST 8/14/20/02锛?  workflow_dispatch:

# P1-S13锛氭湰宸ヤ綔娴佸繀椤诲啓 release锛坈ontents: write锛夆€斺€斿凡鏄渶灏忓寲锛屼笉鍐嶆敹鏁?permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      # 涓嶉厤缃?cache: pnpm 鈥斺€?skip 鏇存柊鏃?pnpm store 涓嶅瓨鍦紝
      # setup-node 鐨?post 闃舵浼氭姤 Path Validation Error 鎶婃暣涓?job 鏍囩孩锛堝亣璀︽姤锛?      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: check latest dsh
        id: check
        shell: pwsh
        run: |
          $meta = Invoke-RestMethod -Uri "https://registry.npmjs.org/@deepseek-ai/dsh" -UseBasicParsing
          # 鐩爣鐗堟湰 = alpha 涓?latest 涓涔夌増鏈洿楂樿€咃紙涓庡鎴风 fetch_npm_newest 涓€鑷达級銆?          # 鏃у疄鐜?鏈?alpha 灏辩敤 alpha"缂洪櫡锛氬畼鏂瑰彂 stable > alpha 鏃堕暅鍍忔案涓嶈窡闅?stable銆?          $latestT = [string]$meta."dist-tags".latest
          $alphaT  = [string]$meta."dist-tags".alpha
          $pick = {
            param($a, $b)
            $norm = {
              param($s)
              $base = ($s.Trim().TrimStart('v') -split '[-+]')[0]
              try { [version]$base } catch { $null }
            }
            $va = & $norm $a; $vb = & $norm $b
            if ($null -eq $va) { return $b }
            if ($null -eq $vb) { return $a }
            if ($va -gt $vb) { $a } else { $b }
          }
          $latest = & $pick $alphaT $latestT
          # P1-S13 浣欓」锛氱増鏈彿鏉ヨ嚜绗笁鏂?npm registry锛屽厛杩?semver 鐧藉悕鍗曞啀浣跨敤锛坒ail-closed锛?          if ($latest -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.][-0-9A-Za-z.]*)?$') { Write-Host "::error::鐩爣鐗堟湰鍙锋湭杩?semver 鐧藉悕鍗? $latest"; exit 1 }
          $local = (Get-Content runtime/package.json | ConvertFrom-Json).dependencies."@deepseek-ai/dsh"
          Write-Host "alpha=$alphaT latest=$latestT target=$latest local=$local"
          "latest=$latest" >> $env:GITHUB_OUTPUT
          "local=$local" >> $env:GITHUB_OUTPUT
          # 璇箟姣旇緝锛堝蹇?v 鍓嶇紑/棰勫彂甯冨熬缂€锛夛紝鏉滅粷瀛楃涓?-ne 璇垽
          $localBase = (($local.Trim().TrimStart('v')) -split '[-+]')[0]
          $targetBase = (($latest.Trim().TrimStart('v')) -split '[-+]')[0]
          try {
            $lv = [version]$localBase; $tv = [version]$targetBase
            if ($tv -gt $lv) { "need_update=true" >> $env:GITHUB_OUTPUT } else { "need_update=false" >> $env:GITHUB_OUTPUT }
          } catch {
            Write-Host "::error::鐗堟湰鍙锋棤娉曡В鏋?local=$local target=$latest"; exit 1
          }

      - name: update runtime
        if: steps.check.outputs.need_update == 'true'
        shell: pwsh
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          pnpm --dir runtime up "@deepseek-ai/dsh@$env:LATEST" --registry https://registry.npmjs.org
          pnpm --dir runtime install --registry https://registry.npmjs.org

      - name: patch browser-auth SameSite for desktop iframe
        if: steps.check.outputs.need_update == 'true'
        shell: pwsh
        run: |
          # desktop-shell fix: dsh web browser-auth cookie uses SameSite=Strict,
          # which breaks cross-origin iframe embedding (tauri://localhost shell page
          # embeds http://127.0.0.1). Rewrite to SameSite=None; Secure so the auth
          # cookie rides iframe requests (loopback is a trustworthy origin, Secure
          # is honored over http).
          $f = 'runtime/node_modules/@deepseek-ai/dsh-client-connection/lib/index.js'
          if (Test-Path $f) {
            $c = Get-Content $f -Raw
            $c = $c.Replace('SameSite=Strict', 'SameSite=None; Secure')
            Set-Content -Path $f -Value $c -NoNewline -Encoding UTF8
            Write-Host "patched SameSite -> None; Secure"
          } else {
            Write-Host "::warning::dsh-client-connection not found, patch skipped"
          }

      - name: build runtime.zip
        if: steps.check.outputs.need_update == 'true'
        shell: pwsh
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          # 鐗堟湰鍏冩暟鎹細瀹㈡埛绔瘡娆″惎鍔ㄥ彧鎷夎繖涓嚑瀛楄妭鏂囦欢鍋氭洿鏂版娴嬶紝涓嶄笅杞藉ぇ鍖?          Set-Content -Path runtime-version.txt -Value "$env:LATEST" -Encoding ascii -NoNewline
          # tar 鎵撳寘锛氬揩涓旀棤 260 瀛楃璺緞闄愬埗锛圕ompress-Archive 瀵规繁灞?node_modules 浼氬け璐ワ級
          # CI 鐨?cwd 鍗充粨搴撴牴锛宺untime 灏卞湪褰撳墠鐩綍锛圧EADME 閲岀殑 -C .. 鍐欐硶浠呴€傜敤浜庢湰鍦帮級
          if (Test-Path runtime.zip) { Remove-Item runtime.zip -Force }
          tar -a -cf runtime.zip runtime
          Write-Host "runtime.zip size $((Get-Item runtime.zip).Length)"
          # P0-S3锛氱敓鎴?SHA-256 鏍￠獙鏂囦欢锛堝鎴风涓嬭浇鍚庡己鍒舵牎楠岋級
          $hash = (Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path runtime.zip.sha256 -Value $hash -Encoding ascii -NoNewline
          Write-Host "runtime.zip.sha256 = $hash"

      - name: upload to runtime release
        if: steps.check.outputs.need_update == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "runtime"
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title "runtime" --notes "auto-synced runtime" }
          gh release upload $tag runtime.zip runtime.zip.sha256 runtime-version.txt --clobber

      - name: verify release assets
        if: steps.check.outputs.need_update == 'true'
        shell: pwsh
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          # 鍥炶鏍￠獙锛氶噸鏂颁笅杞藉垰涓婁紶鐨勮祫浜э紝纭 zip 鍐呯増鏈?== npm 鐩爣鐗堟湰锛屾潨缁濋潤榛樺け璐?          Start-Sleep -Seconds 5
          $latest = "$env:LATEST"
          curl.exe -s -L --fail -o verify.zip "https://github.com/${{ github.repository }}/releases/download/runtime/runtime.zip"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::鍥炶涓嬭浇 runtime.zip 澶辫触"; exit 1 }
          New-Item -ItemType Directory -Path verify-tmp -Force | Out-Null
          tar -xf verify.zip -C verify-tmp "runtime/node_modules/@deepseek-ai/dsh/package.json"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::瑙ｅ帇鏍￠獙鏂囦欢澶辫触"; exit 1 }
          $ver = (Get-Content verify-tmp/runtime/node_modules/@deepseek-ai/dsh/package.json -Raw | ConvertFrom-Json).version
          Write-Host "zip 鍐呯増鏈?$ver 鏈熸湜=$latest"
          if ($ver -ne $latest) { Write-Host "::error::璧勪骇鐗堟湰鏍￠獙澶辫触"; exit 1 }
          $meta = curl.exe -s -L --fail "https://github.com/${{ github.repository }}/releases/download/runtime/runtime-version.txt"
          if ($LASTEXITCODE -ne 0 -or "$meta".Trim() -ne $latest) { Write-Host "::error::version.txt 鏍￠獙澶辫触: $meta"; exit 1 }
          $sha = curl.exe -s -L --fail "https://github.com/${{ github.repository }}/releases/download/runtime/runtime.zip.sha256"
          $shaLocal = (Get-FileHash verify.zip -Algorithm SHA256).Hash.ToLower()
          if ($LASTEXITCODE -ne 0 -or "$sha".Trim() -ne $shaLocal) { Write-Host "::error::sha256 鏍￠獙澶辫触: $sha vs $shaLocal"; exit 1 }
          Write-Host "::notice::璧勪骇鏍￠獙閫氳繃 version=$ver sha256=$shaLocal"

      - name: commit synced files
        if: steps.check.outputs.need_update == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runtime/package.json runtime/pnpm-lock.yaml
          git diff --staged --quiet; if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(runtime): sync dsh to $env:LATEST [auto]"
            git push
          }
